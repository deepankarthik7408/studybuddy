<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<style>
  :root { --paper:#F5F7FA; --panel:#FFF; --ink:#16213E; --muted:#5B6578; --line:#DCE1EA; --accent:#0E7C86; --mark:#FFD23F; --good:#1F8A4C; --bad:#C2372B; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; }
  main { width: 100%; max-width: 760px; margin: 0 auto; padding: 36px 20px 80px; }
  h1 { font-size: 2.1rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { background: linear-gradient(transparent 60%, var(--mark) 60%); }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 140px;
          padding: 24px; text-align: center; background: var(--panel); border: 2px dashed var(--line); border-radius: 14px; }
  .drop.over { border-color: var(--accent); background: #EEF8F9; }
  .drop p { margin: 0; color: var(--muted); }
  #docname { font-weight: 600; color: var(--ink); word-break: break-word; }
  #file { display: none; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 22px 0 14px; }
  nav button { font: inherit; font-weight: 600; padding: 9px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  @media (max-width: 520px) { nav { grid-template-columns: repeat(2, 1fr); } }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .panel[hidden] { display: none; }
  .go { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  .go:disabled { opacity: .5; cursor: wait; }
  .link { font: inherit; background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
  .out { white-space: pre-wrap; margin-top: 16px; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .q { margin: 20px 0 0; }
  .q p { font-weight: 600; margin: 0 0 8px; }
  .opt { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); padding: 9px 12px; margin: 6px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--good); background: #E7F5EC; }
  .opt.wrong { border-color: var(--bad); background: #FBEAE8; }
  .why { color: var(--muted); font-size: .92rem; margin-top: 6px; }
  .card { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 160px; margin-top: 16px; padding: 24px; text-align: center;
          font: inherit; font-size: 1.15rem; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
  .card.back { background: var(--ink); color: #fff; }
  .cardnav { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--muted); }
  .err { color: var(--bad); margin-top: 14px; }
  #keybox { margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <h1>Study <span>Buddy</span></h1>
  <p class="sub">Upload your notes, then get a summary, ask questions, take a quiz or flip flashcards. <button class="link" id="changeKey" type="button">Change API key</button></p>

  <section class="panel" id="keybox" hidden>
    <p style="margin-top:0"><strong>Paste your free Gemini key to start.</strong> Get one at aistudio.google.com/apikey (sign in with Google). It is saved on this computer only.</p>
    <div class="row"><input id="keyIn" type="password" placeholder="Gemini API key" autocomplete="off"><button class="go" id="saveKey">Save key</button></div>
  </section>

  <div class="drop" id="drop">
    <p>Drag a PDF or text file here</p>
    <button class="go" type="button" id="pick">Choose file</button>
    <p id="docname"></p>
  </div>
  <input type="file" id="file" accept=".pdf,.txt,.md">

  <nav role="tablist" id="tabs">
    <button role="tab" aria-selected="true" data-tab="summary">Summary</button>
    <button role="tab" aria-selected="false" data-tab="ask">Ask</button>
    <button role="tab" aria-selected="false" data-tab="quiz">Quiz</button>
    <button role="tab" aria-selected="false" data-tab="cards">Flashcards</button>
  </nav>

  <section class="panel" id="summary"><button class="go" id="goSummary">Summarise my notes</button><div class="out" id="summaryOut"></div></section>
  <section class="panel" id="ask" hidden>
    <div class="row"><input id="question" placeholder="Ask something about your notes"><button class="go" id="goAsk">Ask</button></div>
    <div class="out" id="askOut"></div>
  </section>
  <section class="panel" id="quiz" hidden><button class="go" id="goQuiz">Make a 5-question quiz</button><div id="quizOut"></div></section>
  <section class="panel" id="cards" hidden><button class="go" id="goCards">Make flashcards</button><div id="cardOut"></div></section>

  <div class="err" id="err" role="alert"></div>
</main>

<script>
let docId = null;
const $ = (id) => document.getElementById(id);
const txt = (v) => Array.isArray(v) ? v.join("\n") : String(v ?? "");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = txt(text); return e; };
const showErr = (m) => ($("err").textContent = m || "");

async function api(path, body) {
  if (!docId) { showErr("Upload a file first."); throw new Error("no doc"); }
  showErr("");
  try {
    const res = await fetch("/api/" + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ doc_id: docId, ...body }) });
    const data = await res.json();
    if (!res.ok) { if (res.status === 400) $("keybox").hidden = false; throw new Error(data.detail || "Something went wrong"); }
    return data;
  } catch (e) { showErr(e.message); throw e; }
}
async function run(btn, out, msg, fn) {
  out.textContent = msg; btn.disabled = true;
  try { await fn(out); } catch (e) { out.textContent = ""; } finally { btn.disabled = false; }
}

// ---- API key ----
fetch("/api/key").then((r) => r.json()).then((s) => { $("keybox").hidden = s.has_key; });
$("changeKey").onclick = () => { $("keybox").hidden = false; $("keyIn").focus(); };
$("saveKey").onclick = async () => {
  const key = $("keyIn").value.trim(); if (!key) return;
  await fetch("/api/key", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key }) });
  $("keyIn").value = ""; $("keybox").hidden = true; showErr("");
};

// ---- upload ----
async function upload(file) {
  if (!file) return;
  const form = new FormData(); form.append("file", file);
  $("docname").textContent = "Reading " + file.name + "...";
  try {
    const res = await fetch("/api/upload", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) { $("docname").textContent = ""; return showErr(data.detail); }
    docId = data.doc_id; showErr("");
    $("docname").textContent = data.name + " is ready (" + data.chunks + " sections)";
  } catch (e) { $("docname").textContent = ""; showErr("Upload failed."); }
}
$("pick").onclick = () => $("file").click();
$("file").onchange = (e) => { upload(e.target.files[0]); e.target.value = ""; };
["dragenter", "dragover"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));

// ---- tabs ----
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  ["summary", "ask", "quiz", "cards"].forEach((t) => $(t).hidden = t !== b.dataset.tab);
});

// ---- summary / ask ----
$("goSummary").onclick = (e) => run(e.target, $("summaryOut"), "Summarising...", async (out) => { out.textContent = (await api("summary", {})).summary; });
function doAsk() {
  const q = $("question").value.trim(); if (!q) return;
  run($("goAsk"), $("askOut"), "Thinking...", async (out) => { out.textContent = (await api("ask", { question: q })).answer; });
}
$("goAsk").onclick = doAsk;
$("question").onkeydown = (e) => e.key === "Enter" && doAsk();

// ---- quiz ----
$("goQuiz").onclick = (e) => run(e.target, $("quizOut"), "Writing questions...", async (out) => {
  const { questions } = await api("quiz", { count: 5 }); out.textContent = "";
  questions.forEach((q, i) => {
    const box = el("div", "q"), why = el("div", "why"), btns = [];
    box.append(el("p", null, (i + 1) + ". " + q.question));
    q.options.forEach((t, j) => {
      const b = el("button", "opt", t); b.type = "button";
      b.onclick = () => {
        btns.forEach((o, k) => { o.disabled = true; if (k === q.answer) o.classList.add("right"); });
        if (j !== q.answer) b.classList.add("wrong");
        why.textContent = q.explanation || "";
      };
      btns.push(b); box.append(b);
    });
    box.append(why); out.append(box);
  });
});

// ---- flashcards ----
$("goCards").onclick = (e) => run(e.target, $("cardOut"), "Making cards...", async (out) => {
  const { cards } = await api("flashcards", { count: 8 });
  let i = 0, flipped = false; out.textContent = "";
  const card = el("button", "card"), nav = el("div", "cardnav"), count = el("span");
  const prev = el("button", "go", "Previous"), next = el("button", "go", "Next");
  nav.append(prev, count, next); out.append(card, nav);
  const draw = () => { card.textContent = txt(flipped ? cards[i].back : cards[i].front); card.classList.toggle("back", flipped); count.textContent = (i + 1) + " / " + cards.length; };
  card.onclick = () => { flipped = !flipped; draw(); };
  prev.onclick = () => { i = (i - 1 + cards.length) % cards.length; flipped = false; draw(); };
  next.onclick = () => { i = (i + 1) % cards.length; flipped = false; draw(); };
  draw();
});
</script>
</body>
</html>
